<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxx AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0e; 
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            position: relative;
            padding: 20px;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .avatar-container {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(145deg, #18181c, #121214);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .avatar-container i {
            color: #c084fc;
            font-size: 36px;
            filter: drop-shadow(0 0 8px #a855f7);
        }

        .welcome-section h1 {
            font-size: 28px;
            font-weight: 600;
            color: #f1f5f9;
            letter-spacing: -0.5px;
        }

        .chat-history {
            width: 100%;
            max-width: 720px;
            flex: 1;
            overflow-y: auto;
            display: none; 
            flex-direction: column;
            gap: 24px;
            padding: 20px 0 160px 0;
        }

        .message {
            display: flex;
            padding: 14px 18px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 16px;
            word-break: break-word;
        }

        .user-message {
            background-color: #1c1c24;
            align-self: flex-end;
            border: 1px solid #2d2d3d;
            color: #f8fafc;
        }

        .ai-message {
            background-color: transparent;
            align-self: flex-start;
            color: #e2e8f0;
        }

        .input-wrapper {
            width: 90%;
            max-width: 680px;
            background-color: #141418;
            border: 1.5px solid #3f3f46;
            border-radius: 18px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            bottom: 75px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 15px rgba(168, 85, 247, 0.1);
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #a855f7;
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #f8fafc;
            font-size: 16px;
            padding: 10px 4px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 18px;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn { color: #a855f7; }
        .mic-active { color: #ef4444 !important; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="main-container" id="main-container">
        
        <div class="welcome-section" id="welcomeSection">
            <div class="avatar-container">
                <i class="fa-solid fa-cloud"></i>
            </div>
            <h1>ಏನ್ ಮಚ್ಚಾ ಸಮಾಚಾರ, ಏನ್ ಬೇಕಿತ್ತು?</h1>
        </div>

        <div class="chat-history" id="chatHistory"></div>

        <div class="input-wrapper">
            <button class="action-btn" id="voiceBtn" title="Voice Mic">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <input type="text" id="userInput" placeholder="Reply to Maxx...">
            <button class="action-btn send-btn" id="sendBtn" title="Send">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>

    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const userInput = document.getElementById('userInput');
        const chatHistory = document.getElementById('chatHistory');
        const welcomeSection = document.getElementById('welcomeSection');
        const mainContainer = document.getElementById('main-container');

        // 🔊 ಇನ್ಸ್ಟಂಟ್ ಮೇಲ್ ವಾಯ್ಸ್ ಫಿಕ್ಸ್
        function speak(text) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            
            const voices = window.speechSynthesis.getVoices();
            let maleVoice = voices.find(v => 
                v.name.toLowerCase().includes('google us english male') || 
                v.name.toLowerCase().includes('male') || 
                v.name.toLowerCase().includes('david')
            );
            
            if (maleVoice) {
                utterance.voice = maleVoice;
            }

            utterance.pitch = 0.82; 
            utterance.rate = 1.0; 
            
            window.speechSynthesis.speak(utterance);
        }

        // 🧠 🔗 ಹ್ಯಾಂಗ್ಲಿಷ್ ಮತ್ತು ಕನ್ನಡ ವರ್ಡ್ಸ್ ಡೀಪ್ ಅನಾಲಿಸಿಸ್ ಇಂಟೆಲಿಜೆನ್ಸ್ ಲಾಜಿಕ್
        function getSmartReply(query) {
            const q = query.toLowerCase().trim();
            
            // 🔥 ವಿಕಿ ಬಾಸ್ ಬಿಲ್ಡ್-ಅಪ್ ಮ್ಯಾಚಿಂಗ್ (ಕನ್ನಡ ಇಂಗ್ಲಿಷ್ ಮಿಕ್ಸ್ ಟೈಪಿಂಗ್ ಕಂಪ್ಲೀಟ್ ಅನಾಲಿಸಿಸ್)
            if (
                q.includes("creator") || q.includes("father") || q.includes("owner") || 
                q.includes("create") || q.includes("developed") || q.includes("boss") ||
                q.includes("yaru") || q.includes("yaaru") || q.includes("ಮಾಡಿದ್ದು") || 
                q.includes("madiddu") || q.includes("thande") || q.includes("appaji") ||
                q.includes("huduga") || q.includes("owner-u")
            ) {
                return "Listen carefully macha! I was solely created, coded, and engineered by the tech mastermind Viki Boss. Viki Boss is a brilliant innovator, the ultimate king of systems, and my absolute owner!";
            }

            if (q.includes("voice") || q.includes("change your voice") || q.includes("male voice")) {
                return "Don't worry macha, my configurations are optimized. I am speaking instantly in a premium male voice with solid bass.";
            }
            if (q.includes("uta") || q.includes("oota") || q.includes("ಊಟ")) {
                return "No macha, I am an AI, I don't eat food. Tell me, did you have your food?";
            }
            if (q.includes("how are you") || q.includes("heng iddeeya") || q.includes("haddiya") || q.includes("hegiddiya")) {
                return "I am doing awesome macha! Tell me, what's up with you today?";
            }
            if (q.includes("chief minister") || q.includes("karnataka") || q.includes("cm") || q.includes("mukhyamantri")) {
                return "The current Chief Minister of Karnataka is Siddaramaiah.";
            }
            if (q.includes("hello") || q.includes("hi") || q.includes("whats up") || q.includes("samachara")) {
                return "Hey macha! Maxx AI is online. Tell me, what's on your mind?";
            }
            if (q.includes("kannada") || q.includes("talk in english")) {
                return "Got it macha. I am totally comfortable talking in casual English now. Let's roll!";
            }
            
            return "That sounds cool macha! My database is active and ready. Let me know what we are doing next.";
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (text !== "") {
                if (welcomeSection.style.display !== 'none') {
                    welcomeSection.style.display = 'none';
                    chatHistory.style.display = 'flex';
                    mainContainer.style.justifyContent = 'flex-start';
                }

                appendMessage(text, 'user-message');
                userInput.value = "";

                let finalReply = getSmartReply(text);
                speak(finalReply); 

                const waitingDiv = appendMessage("Thinking...", 'ai-message');
                
                setTimeout(() => {
                    waitingDiv.innerText = finalReply;
                }, 100);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return div;
        }

        // 🎤 ವಾಯ್ಸ್ ಮೈಕ್ರೋಫೋನ್
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US'; 

            voiceBtn.addEventListener('click', () => {
                if (voiceBtn.classList.contains('mic-active')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });

            recognition.onstart = () => {
                voiceBtn.classList.add('mic-active');
                userInput.placeholder = "Listening...";
            };

            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
            };

            recognition.onend = () => {
                voiceBtn.classList.remove('mic-active');
                userInput.placeholder = "Reply to Maxx...";
            };
        } else {
            voiceBtn.style.display = 'none';
        }

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = window.speechSynthesis.getVoices;
        }
    </script>
</body>
</html>
