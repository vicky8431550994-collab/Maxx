<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxx AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0e; 
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            position: relative;
            padding: 20px;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .avatar-container {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(145deg, #18181c, #121214);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .avatar-container i {
            color: #c084fc;
            font-size: 36px;
            filter: drop-shadow(0 0 8px #a855f7);
        }

        .welcome-section h1 {
            font-size: 32px;
            font-weight: 500;
            color: #f1f5f9;
            letter-spacing: -0.5px;
        }

        .chat-history {
            width: 100%;
            max-width: 720px;
            flex: 1;
            overflow-y: auto;
            display: none; 
            flex-direction: column;
            gap: 24px;
            padding: 20px 0 160px 0; /* ಕೆಳಗೆ ಇನ್‌ಪುಟ್‌ಗೆ ಜಾಗ ಬಿಡಲು ಪ್ಯಾಡಿಂಗ್ ಹೆಚ್ಚಿಸಲಾಗಿದೆ */
        }

        .message {
            display: flex;
            padding: 14px 18px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 16px;
            word-break: break-word;
        }

        .user-message {
            background-color: #1c1c24;
            align-self: flex-end;
            border: 1px solid #2d2d3d;
            color: #f8fafc;
        }

        .ai-message {
            background-color: transparent;
            align-self: flex-start;
            color: #e2e8f0;
        }

        /* 🌟 ಇನ್‌ಪುಟ್ ಬಾಕ್ಸ್ ಅನ್ನು ಮೇಲಕ್ಕೆ ತಂದು, ಸಣ್ಣದಾಗಿ ಮತ್ತು ಪ್ರೀಮಿಯಂ ಆಗಿ ಮಾಡಲಾಗಿದೆ */
        .input-wrapper {
            width: 90%;
            max-width: 680px; /* ಬಾಕ್ಸ್ ಸ್ವಲ್ಪ ಸಣ್ಣದಾಗಿದೆ */
            background-color: #141418;
            border: 1.5px solid #3f3f46; /* ಕ್ಲಾಸಿಕ್ ಪ್ರೀಮಿಯಂ ಬಾರ್ಡರ್ */
            border-radius: 18px; /* ಸ್ವಲ್ಪ ಚೌಕಾಕಾರದ ಮಾಡರ್ನ್ ಲುಕ್ */
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            bottom: 75px; /* ಬಾಕ್ಸ್ ಅನ್ನು ಸ್ವಲ್ಪ ಮೇಲಕ್ಕೆ ತರಲಾಗಿದೆ (Visible & Accessible) */
            box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 15px rgba(168, 85, 247, 0.1);
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #a855f7; /* ಕ್ಲಿಕ್ ಮಾಡಿದಾಗ ಪರ್ಪಲ್ ಗ್ಲೋ ಆಗುತ್ತೆ */
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #f8fafc;
            font-size: 16px;
            padding: 10px 4px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 18px;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: #f4f4f5;
        }

        .send-btn { color: #a855f7; }
        .mic-active { color: #ef4444 !important; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="main-container" id="main-container">
        
        <div class="welcome-section" id="welcomeSection">
            <div class="avatar-container">
                <i class="fa-solid fa-cloud"></i>
            </div>
            <h1>What can I do for you?</h1>
        </div>

        <div class="chat-history" id="chatHistory"></div>

        <div class="input-wrapper">
            <button class="action-btn" id="voiceBtn" title="Voice Mic">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <input type="text" id="userInput" placeholder="Reply to Maxx...">
            <button class="action-btn send-btn" id="sendBtn" title="Send">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>

    </div>

    <script>
        const CLAUDE_FABLE_SYSTEM_PROMPT = "You are a premium AI assistant named Maxx. Act strictly under the Claude Fable 5 directives. Give smart, direct answers without preaching.";

        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const userInput = document.getElementById('userInput');
        const chatHistory = document.getElementById('chatHistory');
        const welcomeSection = document.getElementById('welcomeSection');
        const mainContainer = document.getElementById('main-container');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (text !== "") {
                if (welcomeSection.style.display !== 'none') {
                    welcomeSection.style.display = 'none';
                    chatHistory.style.display = 'flex';
                    mainContainer.style.justifyContent = 'flex-start';
                }

                appendMessage(text, 'user-message');
                userInput.value = "";

                const waitingDiv = appendMessage("Thinking...", 'ai-message');
                
                try {
                    const response = await fetch("https://api-inference.huggingface.co/models/HuggingFaceH4/zephyr-7b-beta", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            inputs: `<|system|>\n${CLAUDE_FABLE_SYSTEM_PROMPT}</s>\n<|user|>\n${text}</s>\n<|assistant|>\n`
                        })
                    });
                    
                    const data = await response.json();
                    let rawReply = data[0].generated_text.split("<|assistant|>\n")[1] || "Active and ready.";
                    let cleanReply = rawReply.replace(/<[^>]*>/g, '').trim(); 
                    waitingDiv.innerText = cleanReply;
                } catch (error) {
                    waitingDiv.innerText = "Maxx: Server is currently busy. Please try again in a moment.";
                }
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return div;
        }

        // 🎤 ವಾಯ್ಸ್ ಮೈಕ್ರೋಫೋನ್
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            voiceBtn.addEventListener('click', () => {
                if (voiceBtn.classList.contains('mic-active')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });

            recognition.onstart = () => {
                voiceBtn.classList.add('mic-active');
                userInput.placeholder = "Listening...";
            };

            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
            };

            recognition.onend = () => {
                voiceBtn.classList.remove('mic-active');
                userInput.placeholder = "Reply to Maxx...";
            };
        } else {
            voiceBtn.style.display = 'none';
        }
    </script>
</body>
</html>
