<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxx AI - Premium Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d11; 
            color: #f5f5f7;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ಡೆಸ್ಕ್‌ಟಾಪ್ ಸೈಡ್‌ಬಾರ್ */
        .sidebar {
            width: 260px;
            background-color: #16161a;
            border-right: 1px solid #232329;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; } 
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 600;
            color: #d4af37; 
        }

        .custom-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
        }

        /* ಮುಖ್ಯ ಚಾಟ್ ಸ್ಕ್ರೀನ್ */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0d0d11;
            position: relative;
        }

        /* ಮೊಬೈಲ್ ಟಾಪ್ ಹೆಡರ್ */
        .mobile-header {
            display: none;
            padding: 15px;
            background-color: #16161a;
            border-bottom: 1px solid #232329;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .mobile-header { display: flex; }
        }

        /* ಚಾಟ್ ಕಂಟೈನರ್ */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 15% 120px 15%; 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .chat-container { padding: 20px 5% 120px 5%; }
        }

        /* ಚಾಟ್ ಮೆಸೇಜ್ ಬಾಕ್ಸ್ */
        .message {
            display: flex;
            gap: 14px;
            padding: 15px 20px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.5;
            word-break: break-word;
        }

        .user-message {
            background-color: #1c1c24;
            align-self: flex-end;
            border: 1px solid #2d2d38;
        }

        .ai-message {
            background-color: transparent;
            align-self: flex-start;
        }

        /* ಪ್ರೊಫೈಲ್ ಅವತಾರ್ */
        .ai-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #d4af37;
            flex-shrink: 0;
        }

        /* ಟೈಪಿಂಗ್ ಮತ್ತು ವಾಯ್ಸ್ ಬಾರ್ */
        .input-area {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            background-color: #16161a;
            border: 1px solid #2d2d38;
            border-radius: 30px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .input-area { width: 90%; bottom: 15px; }
        }

        .input-area input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #f5f5f7;
            font-size: 16px;
            padding: 12px 5px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 18px;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn { color: #d4af37; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-section">
            <img src="https://i.pinimg.com/736x/f5/61/de/f561de0bc706ec6fae8df991a0298a09.jpg" alt="Maxx" class="custom-logo">
            <span>Maxx</span>
        </div>
        <div style="color: #666; font-size: 12px;">© 2026 Maxx AI</div>
    </div>

    <div class="main-chat">
        
        <div class="mobile-header">
            <img src="https://i.pinimg.com/736x/f5/61/de/f561de0bc706ec6fae8df991a0298a09.jpg" alt="Maxx" class="custom-logo" style="width:35px; height:35px;">
            <span style="font-weight: 600; color: #d4af37;">Maxx AI</span>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message ai-message">
                <img src="https://i.pinimg.com/736x/f5/61/de/f561de0bc706ec6fae8df991a0298a09.jpg" alt="Maxx" class="ai-avatar">
                <div>ಹಲೋ ವಿಕ್ಕಿ, ನಾನು ನಿಮ್ಮ ಹೊಸ ಪ್ರೀಮಿಯಂ ಅಸಿಸ್ಟೆಂಟ್ **Maxx**. ಇಂದು ನಿಮಗೆ ಹೇಗೆ ಸಹಾಯ ಮಾಡಲಿ?</div>
            </div>
        </div>

        <div class="input-area">
            <button class="icon-btn" id="voiceBtn">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <input type="text" id="userInput" placeholder="Ask Maxx anything...">
            <button class="icon-btn send-btn" id="sendBtn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        const chatContainer = document.getElementById('chatContainer');

        sendBtn.addEventListener('click', () => {
            if(userInput.value.trim() !== "") {
                const userDiv = document.createElement('div');
                userDiv.className = 'message user-message';
                userDiv.innerText = userInput.value;
                chatContainer.appendChild(userDiv);
                
                userInput.value = "";
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        });
    </script>
</body>
</html>
