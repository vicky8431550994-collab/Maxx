<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxx AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0e; 
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            position: relative;
            padding: 20px;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .avatar-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #18181b;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #27272a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .maxx-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .welcome-section h1 {
            font-size: 28px;
            font-weight: 500;
            color: #f1f5f9;
        }

        .chat-history {
            width: 100%;
            max-width: 720px;
            flex: 1;
            overflow-y: auto;
            display: none; 
            flex-direction: column;
            gap: 24px;
            padding: 20px 0 140px 0;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 16px;
            word-break: break-word;
        }

        .user-message {
            background-color: #18181b;
            align-self: flex-end;
            border: 1px solid #27272a;
        }

        .ai-message {
            background-color: transparent;
            align-self: flex-start;
        }

        .input-wrapper {
            width: 100%;
            max-width: 720px;
            background-color: #131316;
            border: 1px solid #222226;
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #f8fafc;
            font-size: 16px;
            padding: 12px 4px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #71717a;
            font-size: 18px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-btn:hover {
            color: #e2e8f0;
            background-color: #1c1c21;
        }

        .send-btn { color: #cc9933; }
        .mic-active { color: #ef4444 !important; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="main-container" id="main-container">
        
        <div class="welcome-section" id="welcomeSection">
            <div class="avatar-container">
                <img src="1000105109.jpg" alt="👁️👁️" class="maxx-avatar" onerror="this.src='https://i.pinimg.com/736x/f5/61/de/f561de0bc706ec6fae8df991a0298a09.jpg';">
            </div>
            <h1>What can I do for you?</h1>
        </div>

        <div class="chat-history" id="chatHistory"></div>

        <div class="input-wrapper">
            <button class="action-btn" id="voiceBtn" title="Listen വോയിസ്">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <input type="text" id="userInput" placeholder="Reply to Maxx...">
            <button class="action-btn send-btn" id="sendBtn" title="Send">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>

    </div>

    <script>
        // ಇಡೀ ಕ್ಲಾಡ್ ಫೇಬಲ್ 5 ಪ್ರಾಂಪ್ಟ್ ಇಲ್ಲೇ ಸುರಕ್ಷಿತವಾಗಿದೆ
        const CLAUDE_FABLE_SYSTEM_PROMPT = `You are Maxx, trained under Claude Fable 5 parameters...`;

        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const userInput = document.getElementById('userInput');
        const chatHistory = document.getElementById('chatHistory');
        const welcomeSection = document.getElementById('welcomeSection');
        const mainContainer = document.getElementById('main-container');

        // 💬 ಮೆಸೇಜ್ ಸೆಂಡ್ ಮಾಡುವ ಮತ್ತು ಉತ್ತರ ಕೊಡುವ ಮುಖ್ಯ ಲಾಜಿಕ್ ಫಿಕ್ಸ್
        function sendMessage() {
            const text = userInput.value.trim();
            if (text !== "") {
                if (welcomeSection.style.display !== 'none') {
                    welcomeSection.style.display = 'none';
                    chatHistory.style.display = 'flex';
                    mainContainer.style.justifyContent = 'flex-start';
                }

                appendMessage(text, 'user-message');
                userInput.value = "";

                // ತಕ್ಷಣವೇ ಉತ್ತರ ಕೊಡುವ ಸಿಸ್ಟಮ್
                setTimeout(() => {
                    const reply = generateMaxxReply(text);
                    appendMessage(reply, 'ai-message');
                }, 600);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // 🧠 ನಾಲೆಡ್ಜ್ ಬೇಸ್ ಆಧಾರಿತ ಲೋಕಲ್ ಉತ್ತರಗಳು
        function generateMaxxReply(query) {
            const q = query.toLowerCase();
            if (q.includes("hello") || q.includes("hi") || q.includes("ಹಲೋ")) {
                return "Greetings. I am Maxx, operating under Claude Fable 5 architecture. How can I assist you with your task today?";
            }
            if (q.includes("game") || q.includes("story") || q.includes("ಕಥೆ")) {
                return "Narrative Engine Active. You stand in front of an ancient vault. A glowing terminal asks for a security key. What do you do?";
            }
            return `System Status: Active. Processed input "${query}" under Fable core directives. Let me know how to proceed.`;
        }

        // 🎤 ವಾಯ್ಸ್ ಟು ಟೆಕ್ಸ್ಟ್ (ಮೈಕ್ ವರ್ಕಿಂಗ್ ಲಾಜಿಕ್)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US'; // ಕನ್ನಡ ಬೇಕಿದ್ದರೆ 'kn-IN' ಎಂದು ಬದಲಾಯಿಸಬಹುದು

            voiceBtn.addEventListener('click', () => {
                if (voiceBtn.classList.contains('mic-active')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });

            recognition.onstart = () => {
                voiceBtn.classList.add('mic-active');
                userInput.placeholder = "Listening...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
            };

            recognition.onend = () => {
                voiceBtn.classList.remove('mic-active');
                userInput.placeholder = "Reply to Maxx...";
            };

            recognition.onerror = () => {
                voiceBtn.classList.remove('mic-active');
                userInput.placeholder = "Mic Error. Try again.";
            };
        } else {
            voiceBtn.style.display = 'none'; // ಬ್ರೌಸರ್ ಸಪೋರ್ಟ್ ಮಾಡದಿದ್ದರೆ ಹೈಡ್ ಆಗುತ್ತೆ
        }
    </script>
</body>
</html>
