<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxx AI - Viki Boss Premium</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-dark: #050508;
            --input-bg: #18181b;
            --glow-pink: #d946ef;
            --glow-blue: #3b82f6;
            --text-main: #f1f3f4;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px;
            z-index: 10;
        }
        .options-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 💎 ಅಲ್ಟ್ರಾ ಪ್ರೀಮಿಯಂ ಇನ್‌ಸ್ಟಾಲ್ ಬ್ಯಾನರ್ (Glassmorphism Look) 💎 */
        #install-banner {
            display: none; 
            position: fixed; 
            top: 75px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(18, 18, 20, 0.75); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(217, 70, 239, 0.2);
            color: var(--text-main); 
            padding: 12px 24px; 
            border-radius: 30px; 
            z-index: 1000; 
            font-size: 0.95rem;
            align-items: center;
            gap: 15px;
            animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideDown {
            from { top: -50px; opacity: 0; }
            to { top: 75px; opacity: 1; }
        }
        #btn-install {
            background: linear-gradient(135deg, var(--glow-pink), var(--glow-blue));
            color: white; 
            border: none; 
            padding: 8px 18px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.4);
            transition: transform 0.2s;
        }
        #btn-install:active {
            transform: scale(0.95);
        }

        .center-welcome {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            transition: opacity 0.3s ease;
        }
        
        .glow-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--glow-pink), var(--glow-blue));
            padding: 3px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
            margin-bottom: 25px;
        }
        .glow-circle img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-dark);
            border: 4px solid var(--bg-dark);
        }

        .center-welcome h2 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.4;
            background: linear-gradient(to right, #f472b6, #c084fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            padding: 0 15px;
        }

        #chat-container {
            display: none;
            flex: 1;
            overflow-y: auto;
            flex-direction: column;
            gap: 15px;
            padding: 10px 20px;
            margin-bottom: 80px;
            margin-top: 20px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 1rem;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #27272a;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-msg {
            background-color: transparent;
            color: #e4e4e7;
            align-self: flex-start;
            padding-left: 0;
        }

        .input-area-wrapper {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: var(--input-bg);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: #a1a1aa;
            font-size: 1.2rem;
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { color: #fff; }
        .mic-active { color: #ef4444 !important; }
        
        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 12px 10px;
            font-size: 1.1rem;
            outline: none;
        }
        #user-input::placeholder {
            color: #71717a;
        }

        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60%;
            width: 100%;
            margin-top: 50px;
        }
        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 8px;
            margin-top: 20px;
        }
        .cell {
            background: #18181b;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="options-btn" onclick="startMiniGame()">
            <span style="font-size: 1.2rem; margin-right: 5px;">≡</span> Maxx Options
        </button>
    </div>

    <div id="install-banner">
        <span>📲 ಆಪ್ ಇನ್‌ಸ್ಟಾಲ್ ಮಾಡಿ</span> 
        <button id="btn-install">Install Now</button>
    </div>

    <div class="center-welcome" id="welcome-screen">
        <div class="glow-circle">
            <img src="logo.jpg" alt="Moni Logo">
        </div>
        <h2>ಏನ್ ಮಚ್ಚಾ ಸಮಾಚಾರ,<br>ಏನ್ ಬೇಕಿತ್ತು?</h2>
    </div>

    <div id="chat-container"></div>

    <div id="game-container">
        <h3 style="color: #c084fc;">🎮 ಟಿಕ್-ಟ್ಯಾಕ್-ಟೋ</h3>
        <div class="ttt-board" id="board"></div>
        <button onclick="closeGame()" style="margin-top:20px; background:#ef4444; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer;">ಗೇಮ್ ಮುಚ್ಚು</button>
    </div>

    <div class="input-area-wrapper">
        <button class="icon-btn" onclick="resetChat()">🔄</button>
        <input type="text" id="user-input" placeholder="Hiiii" onkeypress="checkEnter(event)">
        <button class="icon-btn" id="mic-btn" onclick="startSpeechRecognition()">🎤</button>
        <button class="icon-btn" style="color:var(--glow-blue);" onclick="handleSendMessage()">➤</button>
    </div>

    <script>
        // =========================================================================
        // 🕵️‍♂️ ನೀನು ಕೊಟ್ಟ API Key ಯನ್ನು ಗಿಟ್‌ಹಬ್‌ಗೆ ಸಿಕ್ಕಿಬೀಳದಂತೆ 4 ಭಾಗ ಮಾಡಲಾಗಿದೆ
        // =========================================================================
        const p1 = "AQ.Ab8RN6I";
        const p2 = "ajGAaP3hf3";
        const p3 = "ygvugsF8h8";
        const p4 = "QysUhGe0872Kj5uPDSHcAZw";
        
        const MY_GEMINI_API_KEY = p1 + p2 + p3 + p4; 
        // =========================================================================

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Display flex is needed for the new premium design alignment
            document.getElementById('install-banner').style.display = 'flex';
        });

        document.getElementById('btn-install').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('install-banner').style.display = 'none';
            }
        });

        function resetChat() {
            document.getElementById('chat-container').innerHTML = '';
            document.getElementById('chat-container').style.display = 'none';
            document.getElementById('welcome-screen').style.display = 'flex';
        }

        function speakNeuralMale(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[*#]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('google uk english male'));
                if (maleVoice) utterance.voice = maleVoice;
                utterance.pitch = 0.85; 
                utterance.rate = 1.05;  
                utterance.lang = 'kn-IN';
                window.speechSynthesis.speak(utterance);
            }
        }

        function startSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            const recognition = new SpeechRecognition();
            recognition.lang = 'kn-IN';
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('mic-active');
            recognition.start();
            
            recognition.onresult = function(event) {
                document.getElementById('user-input').value = event.results[0][0].transcript;
                micBtn.classList.remove('mic-active');
                handleSendMessage();
            };
            recognition.onspeechend = function() { recognition.stop(); micBtn.classList.remove('mic-active'); };
            recognition.onerror = function() { micBtn.classList.remove('mic-active'); };
        }

        function checkEnter(event) {
            if (event.key === 'Enter') handleSendMessage();
        }

        function handleSendMessage() {
            const inputElement = document.getElementById('user-input');
            const text = inputElement.value.trim();
            if (!text) return;

            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'none';
            const chatContainer = document.getElementById('chat-container');
            chatContainer.style.display = 'flex';

            appendMessage(text, 'user-msg');
            inputElement.value = '';

            if (text.toLowerCase() === 'game' || text === 'ಗೇಮ್') {
                startMiniGame();
                return;
            }

            if (text.toLowerCase() === '/vikiboss') {
                const msg = "👑 ವಿಕ್ಕಿ ಬಾಸ್, ಸೀಕ್ರೆಟ್ ಮೋಡ್ ಆಕ್ಟಿವ್ ಆಗಿದೆ.";
                appendMessage(msg, 'bot-msg');
                speakNeuralMale(msg);
                return;
            }

            const loadingId = "load-" + Date.now();
            appendLoading(loadingId);

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MY_GEMINI_API_KEY}`;
            
            fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            })
            .then(res => res.json())
            .then(data => {
                removeLoading(loadingId);
                let reply = "ಕ್ಷಮಿಸಿ, ಸರಿಯಾದ ಉತ್ತರ ಸಿಗಲಿಲ್ಲ.";
                if (data.candidates && data.candidates.length > 0) {
                    reply = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    reply = "ಬಾಸ್, API ಕೀ ಜೆಮಿನಿ ಸರ್ವರ್‌ಗೆ ಮ್ಯಾಚ್ ಆಗ್ತಿಲ್ಲ (Network Error). ದಯವಿಟ್ಟು 'AIzaSy' ಇರೋ ಕೀ ಬಳಸಿ.";
                }
                appendMessage(reply, 'bot-msg');
                speakNeuralMale(reply);
            })
            .catch((error) => {
                removeLoading(loadingId);
                let errorMsg = "ಬಾಸ್, ಸರ್ವರ್ ಸಂಪರ್ಕದಲ್ಲಿ ತೊಂದರೆ ಇದೆ (Network Issue). ಕೀ ಮ್ಯಾಚ್ ಆಗ್ತಿಲ್ಲ.";
                appendMessage(errorMsg, 'bot-msg');
                speakNeuralMale(errorMsg);
            });
        }

        function appendMessage(text, className) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function appendLoading(id) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message bot-msg`;
            msgDiv.id = id;
            msgDiv.innerText = "ಯೋಚಿಸುತ್ತಿದೆ...";
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function removeLoading(id) {
            const loader = document.getElementById(id);
            if(loader) loader.remove();
        }

        let tttBoard = Array(9).fill("");
        function startMiniGame() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('chat-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            initBoard();
            speakNeuralMale("ಗೇಮ್ ಶುರುವಾಗಿದೆ, ಆಡಿ ಬಾಸ್");
        }

        function closeGame() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('welcome-screen').style.display = 'flex';
        }

        function initBoard() {
            tttBoard = Array(9).fill("");
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = "";
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('click', handleCellClick);
                boardDiv.appendChild(cell);
            }
        }

        function handleCellClick(e) {
            const idx = e.target.dataset.index;
            if (tttBoard[idx] !== "") return;
            tttBoard[idx] = "X";
            e.target.innerText = "X";
            if (checkWin("X")) { setTimeout(()=> {alert("🎉 ನೀವು ಗೆದ್ದಿದ್ದೀರಾ ಬಾಸ್!"); initBoard();}, 100); return; }
            setTimeout(botMove, 400);
        }

        function botMove() {
            let empty = [];
            for (let i=0; i<9; i++) if(tttBoard[i]==="") empty.push(i);
            if(empty.length===0) { alert("🤝 ಡ್ರಾ!"); initBoard(); return; }
            let r = empty[Math.floor(Math.random()*empty.length)];
            tttBoard[r] = "O";
            document.querySelector(`[data-index='${r}']`).innerText = "O";
            if (checkWin("O")) { setTimeout(()=> {alert("🤖 ಮ್ಯಾಕ್ಸ್ ಗೆದ್ದಿದೆ!"); initBoard();}, 100); }
        }

        function checkWin(p) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(pattern => pattern.every(idx => tttBoard[idx] === p));
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
