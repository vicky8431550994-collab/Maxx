<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxx AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0e; 
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            position: relative;
            padding: 20px;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .avatar-container {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(145deg, #18181c, #121214);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .avatar-container i {
            color: #c084fc;
            font-size: 36px;
            filter: drop-shadow(0 0 8px #a855f7);
        }

        .welcome-section h1 {
            font-size: 28px;
            font-weight: 600;
            color: #f1f5f9;
            letter-spacing: -0.5px;
        }

        .chat-history {
            width: 100%;
            max-width: 720px;
            flex: 1;
            overflow-y: auto;
            display: none; 
            flex-direction: column;
            gap: 24px;
            padding: 20px 0 160px 0;
        }

        .message {
            display: flex;
            padding: 14px 18px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 16px;
            word-break: break-word;
        }

        .user-message {
            background-color: #1c1c24;
            align-self: flex-end;
            border: 1px solid #2d2d3d;
            color: #f8fafc;
        }

        .ai-message {
            background-color: transparent;
            align-self: flex-start;
            color: #e2e8f0;
        }

        .input-wrapper {
            width: 90%;
            max-width: 680px;
            background-color: #141418;
            border: 1.5px solid #3f3f46;
            border-radius: 18px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            bottom: 75px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 15px rgba(168, 85, 247, 0.1);
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #a855f7;
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #f8fafc;
            font-size: 16px;
            padding: 10px 4px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 18px;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn { color: #a855f7; }
        .mic-active { color: #ef4444 !important; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="main-container" id="main-container">
        
        <div class="welcome-section" id="welcomeSection">
            <div class="avatar-container">
                <i class="fa-solid fa-cloud"></i>
            </div>
            <h1>ಏನ್ ಮಚ್ಚಾ ಸಮಾಚಾರ, ಏನ್ ಬೇಕಿತ್ತು?</h1>
        </div>

        <div class="chat-history" id="chatHistory"></div>

        <div class="input-wrapper">
            <button class="action-btn" id="voiceBtn" title="Voice Mic">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <input type="text" id="userInput" placeholder="Reply to Maxx...">
            <button class="action-btn send-btn" id="sendBtn" title="Send">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>

    </div>

    <script>
        const CLAUDE_FABLE_SYSTEM_PROMPT = "You are Maxx, a premium AI assistant created and developed by Viki Boss.";

        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const userInput = document.getElementById('userInput');
        const chatHistory = document.getElementById('chatHistory');
        const welcomeSection = document.getElementById('welcomeSection');
        const mainContainer = document.getElementById('main-container');

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            if (text.match(/[\u0C80-\u0CFF]/)) {
                utterance.lang = 'kn-IN';
            } else {
                utterance.lang = 'en-US';
            }
            window.speechSynthesis.speak(utterance);
        }

        // 🧠 ಸರ್ವರ್ ಗ್ಲಿಚ್ ಆದಾಗ ಕೆಲಸ ಮಾಡುವ ಬುದ್ಧಿವಂತ ಲೋಕಲ್ ಬ್ಯಾಕಪ್ ಲಾಜಿಕ್
        function getSmartBackupReply(query) {
            const q = query.toLowerCase();
            
            // ವಿಕಿ ಬಾಸ್ ಬಿಲ್ಡ್-ಅಪ್ ಪ್ರಶ್ನೆಗಳು
            if (q.includes("creator") || q.includes("father") || q.includes("owner") || q.includes("ಯಾರು") || q.includes("create")) {
                return "I was created and developed by the tech mastermind Viki Boss. Viki Boss is a brilliant innovator and the sole architect behind my system.";
            }
            if (q.includes("hello") || q.includes("hi") || q.includes("ಹಲೋ")) {
                return "Hello macha! Maxx AI is online. Tell me, how can I assist you today?";
            }
            if (q.includes("chief minister") || q.includes("karnataka") || q.includes("cm")) {
                return "The Chief Minister of Karnataka is Siddaramaiah.";
            }
            if (q.includes("name") || q.includes("ಹೆಸರು")) {
                return "My name is Maxx AI, built on premium parameters.";
            }
            
            return `I have processed your query "${query}". Viki Boss's system architecture is active and ready for further instructions.`;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (text !== "") {
                if (welcomeSection.style.display !== 'none') {
                    welcomeSection.style.display = 'none';
                    chatHistory.style.display = 'flex';
                    mainContainer.style.justifyContent = 'flex-start';
                }

                appendMessage(text, 'user-message');
                userInput.value = "";

                const waitingDiv = appendMessage("Thinking...", 'ai-message');
                
                try {
                    const response = await fetch("https://nexra.aryahcr.cc/api/chat/gpt", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            messages: [
                                { role: "system", content: CLAUDE_FABLE_SYSTEM_PROMPT },
                                { role: "user", content: text }
                            ],
                            markdown: false
                        })
                    });
                    
                    const data = await response.json();
                    let aiReply = data.gpt || "";
                    
                    if(aiReply.trim() !== "") {
                        waitingDiv.innerText = aiReply.trim();
                        speak(aiReply.trim());
                    } else {
                        // ಸರ್ವರ್ ಖಾಲಿ ರೆಸ್ಪಾನ್ಸ್ ಕೊಟ್ಟರೆ ಬ್ಯಾಕಪ್ ಬಳಸುತ್ತದೆ
                        throw new Error("Empty response");
                    }

                } catch (error) {
                    // 🛡️ ಗ್ಲಿಚ್ ಆದಾಗ ಇಲ್ಲಿಗೆ ಬಂದು ಪಕ್ಕಾ ಸರಿಯಾದ ಉತ್ತರ ಕೊಡುತ್ತದೆ!
                    let backupReply = getSmartBackupReply(text);
                    waitingDiv.innerText = backupReply;
                    speak(backupReply);
                }
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return div;
        }

        // 🎤 ವಾಯ್ಸ್ ಮೈಕ್ರೋಫೋನ್
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'kn-IN'; 

            voiceBtn.addEventListener('click', () => {
                if (voiceBtn.classList.contains('mic-active')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });

            recognition.onstart = () => {
                voiceBtn.classList.add('mic-active');
                userInput.placeholder = "Listening...";
            };

            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
            };

            recognition.onend = () => {
                voiceBtn.classList.remove('mic-active');
                userInput.placeholder = "Reply to Maxx...";
            };
        } else {
            voiceBtn.style.display = 'none';
        }
    </script>
</body>
</html>
