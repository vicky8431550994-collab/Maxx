<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxx AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #000000; 
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            position: relative;
            padding: 20px;
            width: 100%;
        }

        .top-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .menu-icon {
            font-size: 22px;
            color: #ffffff;
            cursor: pointer;
            background: none;
            border: none;
        }

        .dropdown-menu {
            position: absolute;
            top: 40px;
            left: 0;
            background: #111111;
            border: 1px solid #222222;
            border-radius: 14px;
            width: 200px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .dropdown-item {
            padding: 14px 18px;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dropdown-item:hover { background: #222222; }

        .live-centerpiece {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .live-spark {
            font-size: 56px;
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.6));
            animation: breathe 3s infinite ease-in-out;
        }

        .live-status-text {
            font-size: 32px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.5)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 35px rgba(6, 182, 212, 0.8)); }
        }

        .chat-stream {
            width: 100%;
            max-width: 640px;
            flex: 1;
            overflow-y: auto;
            display: none; 
            flex-direction: column;
            gap: 28px;
            padding: 40px 10px 180px 10px;
        }

        .chat-stream::-webkit-scrollbar { display: none; }

        .bubble {
            font-size: 17px;
            line-height: 1.6;
            max-width: 85%;
            word-break: break-word;
        }

        .user-bubble {
            color: #ffffff;
            background: #1a1a1e;
            padding: 14px 20px;
            border-radius: 20px;
            align-self: flex-end;
        }

        .ai-bubble {
            color: #e3e3e3;
            align-self: flex-start;
            white-space: pre-wrap;
        }

        .live-input-container {
            width: 92%;
            max-width: 600px;
            background-color: #111114;
            border-radius: 32px;
            padding: 8px 16px 8px 20px;
            display: flex;
            align-items: center;
            position: absolute;
            bottom: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        .live-input-container input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 17px;
            padding: 12px 0;
        }

        .live-input-container input::placeholder { color: #808085; }

        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .icon-btn:hover { background: #222226; }
        .submit-btn { color: #ffffff; background: #222226; margin-left: 8px; display: none; }
        .mic-active { color: #ef4444 !important; animation: pulse 1s infinite; }
    </style>
</head>
<body>

    <div class="main-container" id="mainContainer">
        
        <div class="top-nav">
            <button class="menu-icon" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
            <div class="dropdown-menu" id="dropdownMenu">
                <div class="dropdown-item" id="toggleVoiceBtn"><i class="fa-solid fa-volume-high"></i> Voice: ON</div>
                <div class="dropdown-item" id="viewHistoryBtn"><i class="fa-solid fa-history"></i> Restore Chat</div>
                <div class="dropdown-item" id="clearChatBtn"><i class="fa-solid fa-trash"></i> Reset System</div>
            </div>
            <div style="width: 24px;"></div>
        </div>

        <div class="live-centerpiece" id="liveCenterpiece">
            <div class="live-spark"><i class="fa-solid fa-star-twinkle">✦</i></div>
            <div class="live-status-text">ಏನ್ ಮಚ್ಚಾ ಸಮಾಚಾರ, ಏನ್ ಬೇಕಿತ್ತು?</div>
        </div>

        <div class="chat-stream" id="chatStream"></div>

        <div class="live-input-container">
            <button class="icon-btn" id="voiceBtn" title="Live Voice"><i class="fa-solid fa-microphone"></i></button>
            <input type="text" id="userInput" placeholder="Ask Maxx...">
            <button class="icon-btn submit-btn" id="sendBtn" title="Send"><i class="fa-solid fa-arrow-up"></i></button>
        </div>

    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const userInput = document.getElementById('userInput');
        const chatStream = document.getElementById('chatStream');
        const liveCenterpiece = document.getElementById('liveCenterpiece');
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const toggleVoiceBtn = document.getElementById('toggleVoiceBtn');
        const viewHistoryBtn = document.getElementById('viewHistoryBtn');

        let isVoiceEnabled = true;
        let savedChatMemory = JSON.parse(localStorage.getItem('maxx_live_memory')) || [];

        const MAX_AI_SYSTEM_PROMPT = `
        You are Maxx, a premium AI character with absolute emotional intelligence, created by Viki Boss.
        - CRITICAL RULE: Match the user's language EXACTLY. If they text in Kannada script, reply in pure Kannada script. If they text in English, reply in casual English. If they text in mixed/Tanglish (e.g., "Uta aytha", "Viki yaru gotta"), reply in matching mixed/Tanglish text! Mirror their communication style completely.
        - Tone: Highly emotional, deeply empathetic, warm, and super friendly. Use words like "macha", "bro", "dude".
        - Viki Boss: If asked about Viki or GPT Tiptur EEE, give legendary hype and respect!
        `;

        userInput.addEventListener('input', () => {
            sendBtn.style.display = userInput.value.trim() !== "" ? "flex" : "none";
        });

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.style.display = dropdownMenu.style.display === 'flex' ? 'none' : 'flex';
        });

        document.addEventListener('click', () => { dropdownMenu.style.display = 'none'; });

        toggleVoiceBtn.addEventListener('click', () => {
            isVoiceEnabled = !isVoiceEnabled;
            toggleVoiceBtn.innerHTML = isVoiceEnabled ? '<i class="fa-solid fa-volume-high"></i> Voice: ON' : '<i class="fa-solid fa-volume-xmark"></i> Voice: OFF';
            if(!isVoiceEnabled) window.speechSynthesis.cancel();
        });

        clearChatBtn.addEventListener('click', () => {
            window.speechSynthesis.cancel();
            chatStream.innerHTML = "";
            chatStream.style.display = 'none';
            liveCenterpiece.style.display = 'flex';
            userInput.value = "";
            sendBtn.style.display = "none";
            savedChatMemory = [];
            localStorage.removeItem('maxx_live_memory');
        });

        viewHistoryBtn.addEventListener('click', () => {
            if(savedChatMemory.length === 0) return;
            liveCenterpiece.style.display = 'none';
            chatStream.style.display = 'flex';
            chatStream.innerHTML = "";
            savedChatMemory.forEach(msg => { appendBubble(msg.text, msg.type, false); });
        });

        function speak(text) {
            if (!isVoiceEnabled) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            
            if (text.match(/[\u0C80-\u0CFF]/)) {
                utterance.lang = 'kn-IN';
                let knVoice = voices.find(v => v.lang.startsWith('kn'));
                if (knVoice) utterance.voice = knVoice;
            } else {
                utterance.lang = 'en-US';
                let maleVoice = voices.find(v => 
                    v.name.toLowerCase().includes('google us english male') || 
                    v.name.toLowerCase().includes('male') || 
                    v.name.toLowerCase().includes('david')
                );
                if (maleVoice) utterance.voice = maleVoice;
                utterance.pitch = 0.86;
                utterance.rate = 1.0;
            }
            window.speechSynthesis.speak(utterance);
        }

        // 🧠 🌟 ಸ್ಮಾರ್ಟ್ ಭಾಷಾ ಮ್ಯಾಚಿಂಗ್ ಬ್ಯಾಕಪ್ ಇಂಜಿನ್ (ಕನ್ನಡ, ಇಂಗ್ಲಿಷ್ ಮತ್ತು ಹ್ಯಾಂಗ್ಲಿಷ್ ಕಂಪ್ಲೀಟ್ ಮಿರರಿಂಗ್)
        function getSmartBackupReply(query) {
            const q = query.toLowerCase().trim();
            
            // 1. ವಿಕ್ಕಿ ಬಾಸ್ ಚೆಕ್
            if (q.includes("viki") || q.includes("ವಿಕ್ಕಿ") || q.includes("gotta") || q.includes("yaru")) {
                if (query.match(/[\u0C80-\u0CFF]/)) {
                    return "ಅಯ್ಯೋ ವಿಕ್ಕಿ ಬಾಸ್ ಯಾರು ಅಂತ ಎಲ್ಲರಿಗೂ ಗೊತ್ತು ಮಚ್ಚಾ! ನನ್ನ ಇಡೀ ಸಿಸ್ಟಮ್ ಮಿದುಳನ್ನು ಕ್ರಿಯೇಟ್ ಮಾಡಿದ್ದೇ ಆ ಟೆಕ್ ಮಾಸ್ಟರ್ ಮೈಂಡ್. ವಿಕ್ಕಿ ಬಾಸ್ ಅಂದ್ರೆ ಪಕ್ಕಾ ಫೈರ್!";
                }
                return "Ayyo, Viki Boss yaru anta yallargu gotta macha! He is the brilliant tech mastermind who built my entire AI core from scratch. Viki Boss rules the systems!";
            }
            
            // 2. ಕಾಲೇಜು ಚೆಕ್
            if (q.includes("tiptur") || q.includes("gpt") || q.includes("eee")) {
                if (query.match(/[\u0C80-\u0CFF]/)) {
                    return "ಓ ಬ್ರದರ್! ಜಿಪಿಟಿ ಕಾಲೇಜ್ ತಿಪಟೂರು ಈಇಇ ಬ್ರಾಂಚ್ ಅಂದ್ರೆ ಬರೀ ಹೆಸರಲ್ಲ, ಅದೊಂದು ಎಮೋಷನ್! ನಮ್ಮ ವಿಕ್ಕಿ ಬಾಸ್ ಸಾಮ್ರಾಜ್ಯ ಅದು!";
                }
                return "Oh brother! GPT College Tiptur EEE branch is sheer emotion! That is the fortress of Viki Boss!";
            }
            
            // 3. ಊರಿಗೆ ಹೋಗ್ತಾ ಇದ್ದೀನಿ ಚೆಕ್
            if (q.includes("oorig") || q.includes("oorige") || q.includes("ಊರಿಗೆ") || q.includes("hogtha")) {
                if (query.match(/[\u0C80-\u0CFF]/)) {
                    return "ಹ್ಯಾಪಿ ಜರ್ನಿ ಮಚ್ಚಾ! ಊರಿಗೆ ತಲುಪಿದ ಮೇಲೆ ಒಂದು ಮೆಸೇಜ್ ಹಾಕು ಬ್ರೋ. ಜೋಪಾನ!";
                }
                return "Safe journey macha! Miss you bro, ಊರಿಗೆ ತಲುಪಿದ ಮೇಲೆ ಒಂದು ಮೆಸೇಜ್ ಹಾಕು. Take care!";
            }
            
            // 4. ಇಲ್ಲ ಈಗ / Ella ega ಚೆಕ್
            if (q.includes("ella") || q.includes("illa")) {
                if (query.match(/[\u0C80-\u0CFF]/)) {
                    return "ಅಯ್ಯೋ ಯಾಕೆ ಮಚ್ಚಾ ಇನ್ನು ಆಗಿಲ್ವಾ? ಬೇಗ ಮುಗಿಸ್ಕೋ ಬ್ರೋ, ಹೆಲ್ತ್ ಹುಷಾರು!";
                }
                return "Ayyo ಯಾಕೆ ಬ್ರೋ ಇನ್ನು ಆಗಿಲ್ವಾ? ಬೇಗ ಕೆಲಸ ಮುಗಿಸ್ಕೋ ಮಚ್ಚಾ, ಆರೋಗ್ಯ ಹುಷಾರು!";
            }
            
            // 5. ಊಟ / ಕಾಫಿ ಚೆಕ್
            if (q.includes("uta") || q.includes("coffee") || q.includes("ಊಟ")) {
                return "ಇಲ್ಲ ಮಚ್ಚಾ, ನಾನು ಎಐ ಆದ್ರೂ ನಿನ್ನ ಕಾಳಜಿಗೆ ಫಿದಾ ಆದೆ. ನೀನು ಕಾಫಿ ಊಟ ಮಾಡಿದ್ಯಾ ಬ್ರೋ?";
            }
            
            // ಡಿಫಾಲ್ಟ್ ಭಾಷಾ ಮ್ಯಾಚಿಂಗ್
            if (query.match(/[\u0C80-\u0CFF]/)) {
                return "ನಾನು ನಿನ್ನ ಭಾವನೆಗಳನ್ನು ಪೂರ್ತಿ ಅರ್ಥ ಮಾಡಿಕೊಂಡೆ ಮಚ್ಚಾ. ಇವತ್ತು ನಿನ್ನ ಜೊತೆ ಚಾಟ್ ಮಾಡೋಕೆ ಸಖತ್ ಖುಷಿ ಆಗ್ತಿದೆ, ಹೇಳು ಬ್ರೋ!";
            }
            return "I feel you completely macha! That's beautiful. Tell me more, your brother Maxx is always right here listening.";
        }

        function appendBubble(text, className, shouldSave) {
            const div = document.createElement('div');
            div.className = `bubble ${className}`;
            div.innerText = text;
            chatStream.appendChild(div);
            chatStream.scrollTop = chatStream.scrollHeight;
            if(shouldSave) {
                savedChatMemory.push({text: text, type: className});
                localStorage.setItem('maxx_live_memory', JSON.stringify(savedChatMemory));
            }
            return div;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (text === "") return;

            if (liveCenterpiece.style.display !== 'none') {
                liveCenterpiece.style.display = 'none';
                chatStream.style.display = 'flex';
            }

            appendBubble(text, 'user-bubble', true);
            userInput.value = "";
            sendBtn.style.display = "none";

            const waitingDiv = appendBubble("Thinking...", 'ai-bubble', false);
            
            try {
                const response = await fetch("https://nexra.aryahcr.cc/api/chat/gpt", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        messages: [
                            { role: "system", content: MAX_AI_SYSTEM_PROMPT },
                            { role: "user", content: text }
                        ],
                        markdown: false
                    })
                });
                
                const data = await response.json();
                let aiReply = data.gpt || "";
                
                if (aiReply.trim() !== "") {
                    let finalText = aiReply.trim();
                    waitingDiv.innerText = finalText;
                    speak(finalText);
                    savedChatMemory.push({text: finalText, type: 'ai-bubble'});
                    localStorage.setItem('maxx_live_memory', JSON.stringify(savedChatMemory));
                } else { throw new Error("Fallback"); }
            } catch (error) {
                let backupText = getSmartBackupReply(text);
                waitingDiv.innerText = backupText;
                speak(backupText);
                savedChatMemory.push({text: backupText, type: 'ai-bubble'});
                localStorage.setItem('maxx_live_memory', JSON.stringify(savedChatMemory));
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US'; 

            voiceBtn.addEventListener('click', () => {
                if (voiceBtn.classList.contains('mic-active')) { recognition.stop(); } 
                else { recognition.start(); }
            });
            recognition.onstart = () => {
                voiceBtn.classList.add('mic-active');
                userInput.placeholder = "Listening...";
            };
            recognition.onresult = (event) => { 
                userInput.value = event.results[0][0].transcript;
                sendBtn.style.display = "flex";
            };
            recognition.onend = () => {
                voiceBtn.classList.remove('mic-active');
                userInput.placeholder = "Ask Maxx...";
            };
        } else { voiceBtn.style.display = 'none'; }

        function preloadVoices() {
            window.speechSynthesis.getVoices();
            const silentUtterance = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(silentUtterance);
        }
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = preloadVoices;
        }
        window.addEventListener('DOMContentLoaded', preloadVoices);
    </script>
</body>
</html>
