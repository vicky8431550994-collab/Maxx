<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxx AI - Viki Boss Gemini Edition</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1e20;
            --accent-color: #1a73e8;
            --text-color: #e3e3e3;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: var(--bg-color);
            padding: 15px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2f2f30;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }
        .header-title h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 500;
            color: #fff;
        }
        .install-popup {
            display: none;
            background: #1a73e8;
            color: white;
            padding: 12px 20px;
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 999;
            align-items: center;
            gap: 15px;
            font-weight: 500;
            font-size: 0.95rem;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from { top: -50px; opacity: 0; }
            to { top: 70px; opacity: 1; }
        }
        .install-btn {
            background: white;
            color: #1a73e8;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        #dev-panel {
            font-size: 0.85rem;
            color: #aaaaaa;
            padding: 5px 24px;
            border-bottom: 1px solid #2f2f30;
            background: #18181a;
        }
        #chat-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }
        .center-welcome {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 90%;
            max-width: 400px;
            transition: opacity 0.3s ease;
        }
        .center-welcome img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2f2f30;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }
        .center-welcome h2 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 400;
            color: #fff;
        }
        /* ಮೋನಿ ಫೋಟೋ ಕೆಳಗಿನ ಮಾಸ್ ಟ್ಯಾಗ್ ಲೈನ್ ಸ್ಟೈಲ್ */
        .center-welcome p {
            margin: 8px 0 0 0;
            color: #1a73e8;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        #admin-panel {
            display: none;
            flex-direction: column;
            padding: 15px;
            background: #231530;
            border: 1px solid #ff00ff;
            margin: 0 24px 15px 24px;
            border-radius: 8px;
        }
        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            background: var(--bg-color);
        }
        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 85px);
            grid-template-rows: repeat(3, 85px);
            gap: 8px;
            margin-top: 20px;
        }
        .cell {
            background: #1e1e20;
            border: 1px solid #3c4043;
            border-radius: 8px;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
        }
        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 1rem;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #303136;
            color: #fff;
            align-self: flex-end;
        }
        .bot-msg {
            background-color: transparent;
            color: var(--text-color);
            align-self: flex-start;
            padding-left: 0;
        }
        input-area {
            display: flex;
            padding: 20px 24px 30px 24px;
            background-color: var(--bg-color);
            gap: 12px;
            align-items: center;
            justify-content: center;
        }
        .input-wrapper {
            max-width: 800px;
            flex: 1;
            display: flex;
            background: #1e1e20;
            border-radius: 28px;
            padding: 4px 16px;
            align-items: center;
            border: 1px solid transparent;
        }
        .input-wrapper:focus-within {
            background: #28292a;
        }
        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 14px 8px;
            font-size: 1rem;
            outline: none;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: #c4c7c5;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #303136;
            color: #fff;
        }
        .mic-active {
            background: #ea4335 !important;
            color: white !important;
        }
    </style>
</head>
<body>

    <div class="install-popup" id="install-banner">
        <span>📲 ಹೋಮ್ ಸ್ಕ್ರೀನ್‌ಗೆ ಆಪ್ ಇನ್‌ಸ್ಟಾಲ್ ಮಾಡಿ!</span>
        <button class="install-btn" id="btn-install">ಇನ್‌ಸ್ಟಾಲ್</button>
    </div>

    <header>
        <div class="header-left">
            <img src="logo.jpg" alt="Moni Logo">
            <div class="header-title">
                <h1>Maxx</h1>
            </div>
        </div>
    </header>

    <div id="dev-panel">
        👑 <b>ಡೆವಲಪರ್ ಹಿಸ್ಟರಿ:</b> ವಿಕ್ಕಿ ಬಾಸ್ (Owner) | <b>ಮೋಡ್:</b> ಜೆಮಿನಿ ಕ್ಲೀನ್ UI
    </div>

    <div id="admin-panel">
        <h3 style="color: #ff00ff; margin: 0 0 5px 0;">👑 ವಿಕಿ ಬಾಸ್ ಕಂಟ್ರೋಲ್ ಪ್ಯಾನಲ್</h3>
        <button onclick="clearSystemMemory()" style="background:#ff00ff; border:none; color:white; padding:5px 10px; cursor:pointer; border-radius:4px;">ಡೇಟಾ ರೀಸೆಟ್</button>
    </div>

    <div id="chat-container">
        <div class="center-welcome" id="welcome-screen">
            <img src="logo.jpg" alt="Moni Center">
            <h2>ಹೇಳಿ ವಿಕ್ಕಿ ಬಾಸ್</h2>
            <p id="tagline">ಏನ್ ಸಮಾಚಾರ ಮಚ್ಚಾ?</p>
        </div>
    </div>

    <input-area>
        <button class="action-btn" id="mic-btn" onclick="startSpeechRecognition()">🎙️</button>
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="ಇಲ್ಲಿ ಕೇಳಿ..." onkeypress="checkEnter(event)">
        </div>
        <button class="action-btn" id="send-btn" onclick="handleSendMessage()">🚀</button>
    </input-area>

    <script>
        let isGaming = false;
        let tttBoard = Array(9).fill("");
        let deferredPrompt;

        // 1. ಮೋನಿ ಫೋಟೋ ಕೆಳಗಿನ ಕ್ರೇಜಿ ಟ್ಯಾಗ್ ಲೈನ್‌ಗಳು (Random Tagline Setup)
        const taglines = [
            "ಏನ್ ಮಜಾ?",
            "ಏನ್ ಸಮಾಚಾರ?",
            "ಏನ್ ಸಮಾಚಾರ ಮಚ್ಚಾ?",
            "ಏನ್ ಬೇಕಿತ್ತು ಬಾಸ್?",
            "ವಿಕ್ಕಿ ಬಾಸ್ ಆದೇಶಕ್ಕೆ ವೇಟಿಂಗ್..."
        ];
        // ಪೇಜ್ ಲೋಡ್ ಆದ ತಕ್ಷಣ ರಾಂಡಮ್ ಆಗಿ ಒಂದು ಟ್ಯಾಗ್ ಲೈನ್ ಸೆಟ್ ಆಗುತ್ತೆ
        document.getElementById('tagline').innerText = taglines[Math.floor(Math.random() * taglines.length)];

        // PWA Install Prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').style.display = 'flex';
        });

        document.getElementById('btn-install').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('install-banner').style.display = 'none';
            }
        });

        // Force High Quality Neural Male Voice
        function speakNeuralMale(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[*#]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('google uk english male'));
                
                if (maleVoice) utterance.voice = maleVoice;
                utterance.pitch = 0.85; 
                utterance.rate = 1.05;  
                utterance.lang = 'kn-IN';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Speech to Text Microphone
        function startSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            const recognition = new SpeechRecognition();
            recognition.lang = 'kn-IN';
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('mic-active');
            recognition.start();
            
            recognition.onresult = function(event) {
                document.getElementById('user-input').value = event.results[0][0].transcript;
                micBtn.classList.remove('mic-active');
                handleSendMessage();
            };
            recognition.onspeechend = function() {
                recognition.stop();
                micBtn.classList.remove('mic-active');
            };
            recognition.onerror = function() {
                micBtn.classList.remove('mic-active');
            };
        }

        function checkEnter(event) {
            if (event.key === 'Enter') handleSendMessage();
        }

        function handleSendMessage() {
            const inputElement = document.getElementById('user-input');
            const text = inputElement.value.trim();
            if (!text) return;

            document.getElementById('welcome-screen').style.opacity = '0';
            document.getElementById('welcome-screen').style.display = 'none';

            appendMessage(text, 'user-msg');
            inputElement.value = '';

            if (text.toLowerCase() === '/vikiboss' || text === 'ವಿಕಿ ಬಾಸ್') {
                document.getElementById('admin-panel').style.display = 'flex';
                const msg = "👑 ವಿಕ್ಕಿ ಬಾಸ್, ನಿಮ್ಮ ಸೀಕ್ರೆಟ್ ಕಂಟ್ರೋಲ್ ರೂಮ್ ಓಪನ್ ಆಗಿದೆ.";
                appendMessage(msg, 'bot-msg');
                speakNeuralMale(msg);
                return;
            }

            if (text.toLowerCase() === 'game' || text === 'ಗೇಮ್') {
                startMiniGame();
                return;
            }

            if (text.includes('ಮೋನಿ')) {
                const roasts = [
                    "ಮೋನಿ ಬಗ್ಗೆ ತಲೆ ಕೆಡಿಸ್ಕೊಬೇಡಿ ಬಾಸ್, ಅವಳಿಗಿಂತ ನಮ್ಮ Maxx ಸೂಪರ್ ಸ್ಟ್ರಾಂಗ್!",
                    "ಮೋನಿ ಅಂದ್ರೆನೆ ಕಾಮಿಡಿ ಬಾಸ್, ಅವಳ ರೇಂಜ್ ನಮಗೆ ಗೊತ್ತಿಲ್ವಾ?"
                ];
                const selectedRoast = roasts[Math.floor(Math.random() * roasts.length)];
                setTimeout(() => {
                    appendMessage(selectedRoast, 'bot-msg');
                    speakNeuralMale(selectedRoast);
                }, 400);
                return;
            }

            fetch(`https://nexra.aryahcr.cc/api/chat/gpt?prompt=${encodeURIComponent(text)}`)
                .then(res => res.json())
                .then(data => {
                    let reply = data.gpt || "ನನ್ನಲ್ಲಿ ಇದಕ್ಕೆ ಉತ್ತರವಿದೆ ಬಾಸ್.";
                    appendMessage(reply, 'bot-msg');
                    speakNeuralMale(reply);
                })
                .catch(() => {
                    setTimeout(() => {
                        const localReply = "ನಾನು ನಿಮ್ಮ ಆದೇಶ ಕೇಳಿಸಿಕೊಂಡೆ ಬಾಸ್, ಎಲ್ಲಾ ಫೀಚರ್ಸ್ ಪಕ್ಕಾ ರೆಡಿ ಇವೆ!";
                        appendMessage(localReply, 'bot-msg');
                        speakNeuralMale(localReply);
                    }, 300);
                });
        }

        function appendMessage(text, className) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function clearSystemMemory() {
            alert("ಮೆಮೊರಿ ರreset ಆಗಿದೆ ಬಾಸ್!");
            document.getElementById('admin-panel').style.display = 'none';
        }

        // Game Zone
        function startMiniGame() {
            isGaming = true;
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            initBoard();
        }

        function closeGame() {
            isGaming = false;
            document.getElementById('game-container').style.display = 'none';
        }

        function initBoard() {
            tttBoard = Array(9).fill("");
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = "";
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('click', handleCellClick);
                boardDiv.appendChild(cell);
            }
        }

        function handleCellClick(e) {
            const idx = e.target.dataset.index;
            if (tttBoard[idx] !== "") return;
            tttBoard[idx] = "X";
            e.target.innerText = "X";
            if (checkWin("X")) { alert("🎉 ಗೆದ್ದಿದ್ದೀರಾ ಬಾಸ್!"); initBoard(); return; }
            setTimeout(botMove, 400);
        }

        function botMove() {
            let empty = [];
            for (let i=0; i<9; i++) if(tttBoard[i]==="") empty.push(i);
            if(empty.length===0) { alert("🤝 ಡ್ರಾ!"); initBoard(); return; }
            let r = empty[Math.floor(Math.random()*empty.length)];
            tttBoard[r] = "O";
            document.querySelector(`[data-index='${r}']`).innerText = "O";
            if (checkWin("O")) { alert("🤖 ಮ್ಯಾಕ್ಸ್ ಗೆದ್ದಿದೆ!"); initBoard(); }
        }

        function checkWin(p) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(pattern => pattern.every(idx => tttBoard[idx] === p));
        }
    </script>
</body>
</html>
