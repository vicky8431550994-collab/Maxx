<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxx AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0e; /* ಕ್ಲಾಡ್ ಪ್ರೀಮಿಯಂ ಡಾರ್ಕ್ ಹಿನ್ನೆಲೆ */
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ಮುಖ್ಯ ಚಾಟ್ ಕಂಟೈನರ್ */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* ಮಧ್ಯದಲ್ಲಿ ತರಲು */
            position: relative;
            padding: 20px;
        }

        /* ಕ್ಲಾಡ್ ಮಾದರಿಯ ಸೆಂಟರ್ ವೆಲ್ಕಮ್ ಏರಿಯಾ */
        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ನಿಮ್ಮ ಪ್ರೊಫೈಲ್ ಫೋಟೋ - ಬಾರ್ಡರ್ ಇಲ್ಲದೆ ಕ್ಲೀನ್ ಲುಕ್ */
        .maxx-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        /* ಕ್ಲಾಡ್ ಶೈಲಿಯ ಸರಳ ಹೆಡಿಂಗ್ */
        .welcome-section h1 {
            font-size: 32px;
            font-weight: 500;
            color: #f1f5f9;
            letter-spacing: -0.5px;
        }

        /* ಚಾಟ್ ಮೆಸೇಜ್‌ಗಳು ಬರುವ ಜಾಗ (ಮೊದಲು ಖಾಲಿ ಇರುತ್ತೆ) */
        .chat-history {
            width: 100%;
            max-width: 720px;
            flex: 1;
            overflow-y: auto;
            display: none; /* ಮೆಸೇಜ್ ಕಳುಹಿಸಿದಾಗ ಮಾತ್ರ ಇದು ಕಾಣುತ್ತೆ */
            flex-direction: column;
            gap: 24px;
            padding: 20px 0 120px 0;
        }

        .message {
            display: flex;
            gap: 16px;
            padding: 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 16px;
        }

        .user-message {
            background-color: #18181b;
            align-self: flex-end;
            border: 1px solid #27272a;
        }

        .ai-message {
            background-color: transparent;
            align-self: flex-start;
        }

        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* ಕ್ಲಾಡ್ ತರಹದ ಪ್ರೀಮಿಯಂ ಇನ್‌ಪುಟ್ ಬಾಕ್ಸ್ */
        .input-wrapper {
            width: 100%;
            max-width: 720px;
            background-color: #131316;
            border: 1px solid #222226;
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: absolute;
            bottom: 40px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #3f3f46;
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #f8fafc;
            font-size: 16px;
            padding: 12px 4px;
        }

        .input-wrapper input::placeholder {
            color: #52525b;
        }

        /* ಕ್ಲೀನ್ ಐಕಾನ್ ಬಟನ್‌ಗಳು */
        .action-btn {
            background: none;
            border: none;
            color: #71717a;
            font-size: 18px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-btn:hover {
            color: #e2e8f0;
            background-color: #1c1c21;
        }

        .send-btn {
            color: #cc9933; /* ಸಾಫ್ಟ್ ಗೋಲ್ಡ್ ಟಿಂಟ್ */
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="welcome-section" id="welcomeSection">
            <img src="https://i.pinimg.com/736x/f5/61/de/f561de0bc706ec6fae8df991a0298a09.jpg" alt="Maxx" class="maxx-avatar">
            <h1>What can I do for you?</h1>
        </div>

        <div class="chat-history" id="chatHistory"></div>

        <div class="input-wrapper">
            <button class="action-btn" id="voiceBtn" title="Use voice">
                <i class="fa-solid fa-microphone"></i>
            </button>
            
            <input type="text" id="userInput" placeholder="Reply to Maxx...">
            
            <button class="action-btn send-btn" id="sendBtn" title="Send message">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>

    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        const chatHistory = document.getElementById('chatHistory');
        const welcomeSection = document.getElementById('welcomeSection');
        const mainContainer = document.getElementById('main-container');

        const imgUrl = "https://i.pinimg.com/736x/f5/61/de/f561de0bc706ec6fae8df991a0298a09.jpg";

        sendBtn.addEventListener('click', () => {
            if(userInput.value.trim() !== "") {
                // ಮೊದಲ ಮೆಸೇಜ್ ಕಳುಹಿಸಿದ ತಕ್ಷಣ ವೆಲ್ಕಮ್ ಪೇಜ್ ಹೈಡ್ ಮಾಡಿ ಚಾಟ್ ಬಾಕ್ಸ್ ಆನ್ ಮಾಡಿ
                if(welcomeSection.style.display !== 'none') {
                    welcomeSection.style.display = 'none';
                    chatHistory.style.display = 'flex';
                    mainContainer.style.justifyContent = 'flex-start';
                }

                // ಯೂಸರ್ ಮೆಸೇಜ್
                const userDiv = document.createElement('div');
                userDiv.className = 'message user-message';
                userDiv.innerText = userInput.value;
                chatHistory.appendChild(userDiv);
                
                userInput.value = "";
                chatHistory.scrollTop = chatHistory.scrollHeight;

                // ಇಲ್ಲಿ ನಿಮ್ಮ ನಾಲೆಡ್ಜ್ ಪ್ರಾಂಪ್ಟ್ API ಕನೆಕ್ಟ್ ಮಾಡಿ ರೆಸ್ಪಾನ್ಸ್ ತರಬಹುದು
            }
        });

        // Enter ಕೀ ಪ್ರೆಸ್ ಮಾಡಿದರೆ ಮೆಸೇಜ್ ಹೋಗುವಂತೆ ಮಾಡಲು
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });
    </script>
</body>
</html>
