<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maxx AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1118/1118914.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 100%, #0b1528 0%, #030712 80%);
            color: #f3f4f6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            position: relative;
            padding: 20px;
            width: 100%;
        }

        /* 👑 Premium Floating Navbar */
        .top-nav {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
        }

        .menu-trigger-btn {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e5e7eb;
            padding: 12px 18px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .menu-trigger-btn:hover {
            border-color: rgba(192, 132, 252, 0.4);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
        }

        .dropdown-menu {
            position: absolute;
            top: 55px;
            right: 0;
            background: rgba(10, 11, 18, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            width: 200px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            animation: fadeIn 0.2s ease-out;
        }

        .dropdown-item {
            padding: 14px 18px;
            color: #d1d5db;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s;
        }

        .dropdown-item:hover { background: rgba(255, 255, 255, 0.05); color: #ffffff; }

        /* 🪐 Luxury Welcome Area */
        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 26px;
            animation: fadeIn 0.5s ease-out;
        }

        .avatar-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(145deg, #0f172a, #020617);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
            background-image: linear-gradient(#0f172a, #020617), linear-gradient(135deg, #c084fc 0%, #6366f1 100%);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.35);
        }

        .avatar-container i {
            font-size: 42px;
            background: linear-gradient(135deg, #e9d5ff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-section h1 {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.7px;
            text-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
        }

        .chat-history {
            width: 100%;
            max-width: 680px;
            flex: 1;
            overflow-y: auto;
            display: none; 
            flex-direction: column;
            gap: 28px;
            padding: 40px 10px 200px 10px;
        }

        .chat-history::-webkit-scrollbar { display: none; }

        .message {
            font-size: 17.5px;
            line-height: 1.65;
            max-width: 85%;
            word-break: break-word;
        }

        .user-message {
            background: rgba(31, 41, 55, 0.6);
            backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 16px 22px;
            border-radius: 24px 24px 4px 24px;
            align-self: flex-end;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .ai-message {
            color: #f3f4f6;
            font-weight: 500;
            align-self: flex-start;
            white-space: pre-wrap;
            text-shadow: 0 0 1px rgba(255,255,255,0.05);
        }

        /* 💎 Ultra-Luxury Glassmorphism Input Field Box (Perfect 80px Floating Height) */
        .input-wrapper {
            width: 92%;
            max-width: 640px;
            background: rgba(17, 19, 28, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            bottom: 80px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
            z-index: 5;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 20px rgba(99, 102, 241, 0.15);
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 17px;
            padding: 12px 4px;
        }

        .input-wrapper input::placeholder { color: #6b7280; }

        .action-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 20px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-btn:hover { color: #ffffff; background: rgba(255, 255, 255, 0.06); }
        .send-btn { color: #c084fc; display: flex !important; } 
        .mic-active { color: #ef4444 !important; background: rgba(239, 68, 68, 0.1) !important; animation: pulse 1.2s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

            welcomeSection.style.display = 'flex';

        function appendMessage(text, className, shouldSave) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            if(shouldSave) {
                savedChatMemory.push({text: text, type: className});
                localStorage.setItem('maxx_live_v2', JSON.stringify(savedChatMemory));
            }
            return div;
        }
