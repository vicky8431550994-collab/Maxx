<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether AI - Premium Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d11; 
            color: #f5f5f7;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ಸೈಡ್‌ಬಾರ್ */
        .sidebar {
            width: 260px;
            background-color: #16161a;
            border-right: 1px solid #232329;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ನಿಮ್ಮ ಕಸ್ಟಮ್ ಲೋಗೋ ಸ್ಟೈಲ್ */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 600;
            color: #d4af37; 
        }

        .custom-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%; /* ದುಂಡಗಿನ ಲೋಗೋ */
            object-fit: cover;
            border: 2px solid #d4af37; /* ಗೋಲ್ಡನ್ ಬಾರ್ಡರ್ */
        }

        /* ಮುಖ್ಯ ಚಾಟ್ ಏರಿಯಾ */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0d0d11;
            position: relative;
        }

        /* ಚಾಟ್ ಹಿಸ್ಟರಿ ಬಾಕ್ಸ್ */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 15% 120px 15%; 
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ಮೆಸೇಜ್ ಬಾಕ್ಸ್‌ಗಳು */
        .message {
            display: flex;
            gap: 16px;
            padding: 20px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
        }

        .user-message {
            background-color: #1c1c24;
            align-self: flex-end;
            border: 1px solid #2d2d38;
        }

        .ai-message {
            background-color: transparent;
            align-self: flex-start;
        }

        /* AI ಪ್ರೊಫೈಲ್ ಚಿತ್ರದ ಸ್ಟೈಲ್ */
        .ai-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #d4af37;
        }

        /* ಇನ್‌ಪುಟ್ ಕಂಟೈನರ್ (ಟೈಪಿಂಗ್ ಮತ್ತು ವಾಯ್ಸ್ ಬಾಕ್ಸ್) */
        .input-area {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            background-color: #16161a;
            border: 1px solid #2d2d38;
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .input-area input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #f5f5f7;
            font-size: 16px;
            padding: 10px 0;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            color: #d4af37;
            background-color: #232329;
        }

        .send-btn {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-section">
            <img src="logo.jpg" alt="Aether Logo" class="custom-logo">
            <span>Aether</span>
        </div>
        <div style="color: #666; font-size: 12px;">© 2026 Aether AI</div>
    </div>

    <div class="main-chat">
        
        <div class="chat-container" id="chatContainer">
            <div class="message ai-message">
                <img src="logo.jpg" alt="AI Avatar" class="ai-avatar">
                <div>ಹಲೋ ವಿಕ್ಕಿ, ನಾನು ನಿಮ್ಮ ನಾಲೆಡ್ಜ್ ಕ್ಲೌಡ್ ಆಧಾರಿತ **Aether AI**. ಇಂದು ನಿಮಗೆ ಹೇಗೆ ಸಹಾಯ ಮಾಡಲಿ?</div>
            </div>
        </div>

        <div class="input-area">
            <button class="icon-btn" id="voiceBtn" title="ಮೈಕ್ ಬಳಸಿ ಮಾತನಾಡಿ">
                <i class="fa-solid fa-microphone"></i>
            </button>
            
            <input type="text" id="userInput" placeholder="Ask Aether anything...">
            
            <button class="icon-btn send-btn" id="sendBtn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        const chatContainer = document.getElementById('chatContainer');

        sendBtn.addEventListener('click', () => {
            if(userInput.value.trim() !== "") {
                // ಯೂಸರ್ ಮೆಸೇಜ್ ಅಳವಡಿಕೆ
                const userDiv = document.createElement('div');
                userDiv.className = 'message user-message';
                userDiv.innerText = userInput.value;
                chatContainer.appendChild(userDiv);
                
                userInput.value = "";
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                // ನಿಮ್ಮ ನಾಲೆಡ್ಜ್ ಕ್ಲೌಡ್ ಪ್ರಾಂಪ್ಟ್ ಮತ್ತು API ಲಾಜಿಕ್ ಅನ್ನು ಇಲ್ಲಿ ಸೇರಿಸಬಹುದು
            }
        });
    </script>
</body>
</html>
