<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxx AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0e; 
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            position: relative;
            padding: 20px;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .avatar-container {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(145deg, #18181c, #121214);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .avatar-container i {
            color: #c084fc;
            font-size: 36px;
            filter: drop-shadow(0 0 8px #a855f7);
        }

        .welcome-section h1 {
            font-size: 28px;
            font-weight: 600;
            color: #f1f5f9;
            letter-spacing: -0.5px;
        }

        .chat-history {
            width: 100%;
            max-width: 720px;
            flex: 1;
            overflow-y: auto;
            display: none; 
            flex-direction: column;
            gap: 24px;
            padding: 20px 0 160px 0;
        }

        .message {
            display: flex;
            padding: 14px 18px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 16px;
            word-break: break-word;
        }

        .user-message {
            background-color: #1c1c24;
            align-self: flex-end;
            border: 1px solid #2d2d3d;
            color: #f8fafc;
        }

        .ai-message {
            background-color: transparent;
            align-self: flex-start;
            color: #e2e8f0;
        }

        .input-wrapper {
            width: 90%;
            max-width: 680px;
            background-color: #141418;
            border: 1.5px solid #3f3f46;
            border-radius: 18px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            bottom: 75px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 15px rgba(168, 85, 247, 0.1);
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #a855f7;
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #f8fafc;
            font-size: 16px;
            padding: 10px 4px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 18px;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn { color: #a855f7; }
        .mic-active { color: #ef4444 !important; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="main-container" id="main-container">
        
        <div class="welcome-section" id="welcomeSection">
            <div class="avatar-container">
                <i class="fa-solid fa-cloud"></i>
            </div>
            <h1>ಏನ್ ಮಚ್ಚಾ ಸಮಾಚಾರ, ಏನ್ ಬೇಕಿತ್ತು?</h1>
        </div>

        <div class="chat-history" id="chatHistory"></div>

        <div class="input-wrapper">
            <button class="action-btn" id="voiceBtn" title="Voice Mic">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <input type="text" id="userInput" placeholder="Reply to Maxx...">
            <button class="action-btn send-btn" id="sendBtn" title="Send">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>

    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const userInput = document.getElementById('userInput');
        const chatHistory = document.getElementById('chatHistory');
        const welcomeSection = document.getElementById('welcomeSection');
        const mainContainer = document.getElementById('main-container');

        // 🔊 ಪ್ರೀಮಿಯಂ ಡೀಪ್ ಬೇಸ್ ಮೇಲ್ ವಾಯ್ಸ್ ಲಾಜಿಕ್ (100% ಕ್ಲೀನ್ ಸೌಂಡ್)
        function speak(text) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            
            // ಮೊಬೈಲ್ ಮತ್ತು ಸಿಸ್ಟಮ್‌ನಲ್ಲಿ ಲಭ್ಯವಿರುವ ಗಂಡಸಿನ ಧ್ವನಿಗಳನ್ನು ಹುಡುಕುವುದು
            const voices = window.speechSynthesis.getVoices();
            let maleVoice = voices.find(voice => voice.name.toLowerCase().includes('google US english male') || voice.name.toLowerCase().includes('male') || voice.name.toLowerCase().includes('david'));
            
            if (maleVoice) {
                utterance.voice = maleVoice;
            }

            // ಬೇಸ್ ಸೌಂಡ್ ಹೆಚ್ಚಿಸಲು ಸೆಟ್ಟಿಂಗ್ಸ್
            utterance.pitch = 0.85; // ಪಿಚ್ ಕಡಿಮೆ ಮಾಡಿದರೆ ಬೇಸ್ ಸೌಂಡ್ ಹೆಚ್ಚಾಗುತ್ತದೆ
            utterance.rate = 0.95;  // ಸ್ಪಷ್ಟವಾಗಿ ಕೇಳಲು ಸ್ವಲ್ಪ ನಿಧಾನ ಗತಿ
            
            window.speechSynthesis.speak(utterance);
        }

        // 🧠 ಪಕ್ಕಾ ಸರಿಯಾದ ಉತ್ತರ ಕೊಡುವ ಸ್ಮಾರ್ಟ್ ಫಿಕ್ಸ್ಡ್ ಲಾಜಿಕ್
        function getSmartReply(query) {
            const q = query.toLowerCase().trim();
            
            // 1. ವಿಕಿ ಬಾಸ್ ಬಿಲ್ಡ್-ಅಪ್ ಚೆಕ್
            if (q.includes("creator") || q.includes("father") || q.includes("owner") || q.includes("ಯಾರು") || q.includes("create") || q.includes("developed")) {
                return "I was created and developed by the tech mastermind, Viki Boss. Viki Boss is a brilliant innovator and the sole architect behind my entire system intelligence.";
            }
            
            // 2. ಚೀಫ್ ಮಿನಿಸ್ಟರ್ ಪ್ರಶ್ನೆ ಚೆಕ್
            if (q.includes("chief minister") || q.includes("karnataka") || q.includes("cm")) {
                return "The current Chief Minister of Karnataka is Siddaramaiah.";
            }
            
            // 3. ನಾರ್ಮಲ್ ಹಲೋ ಚೆಕ್
            if (q.includes("hello") || q.includes("hi") || q.includes("ಹಲೋ")) {
                return "Hello macha! Maxx AI is online. Tell me, how can I assist you today?";
            }
            
            // 4. ಹೆಸರು ಚೆಕ್
            if (q.includes("name") || q.includes("ಹೆಸರು") || q.includes("who are you")) {
                return "I am Maxx AI, a premium assistant built under advanced system parameters.";
            }
            
            // ಡಿಫಾಲ್ಟ್ ಉತ್ತರ
            return `System parameters validated. I have successfully processed your query: "${query}". Viki Boss's database is active and standing by for further instructions.`;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (text !== "") {
                if (welcomeSection.style.display !== 'none') {
                    welcomeSection.style.display = 'none';
                    chatHistory.style.display = 'flex';
                    mainContainer.style.justifyContent = 'flex-start';
                }

                appendMessage(text, 'user-message');
                userInput.value = "";

                const waitingDiv = appendMessage("Thinking...", 'ai-message');
                
                // ಲಾಜಿಕ್ ಫಿಕ್ಸ್: ತಕ್ಷಣವೇ ಪಕ್ಕಾ ಸರಿಯಾದ ಉತ್ತರವನ್ನು ತರುವುದು
                setTimeout(() => {
                    let finalReply = getSmartReply(text);
                    waitingDiv.innerText = finalReply;
                    speak(finalReply); // ಬೇಸ್ ಮೇಲ್ ವಾಯ್ಸ್ ರನ್ ಆಗುತ್ತದೆ
                }, 500);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return div;
        }

        // 🎤 ವಾಯ್ಸ್ ಮೈಕ್ರೋಫೋನ್ ಇನ್‌ಪುಟ್
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US'; 

            voiceBtn.addEventListener('click', () => {
                if (voiceBtn.classList.contains('mic-active')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });

            recognition.onstart = () => {
                voiceBtn.classList.add('mic-active');
                userInput.placeholder = "Listening...";
            };

            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
            };

            recognition.onend = () => {
                voiceBtn.classList.remove('mic-active');
                userInput.placeholder = "Reply to Maxx...";
            };
        } else {
            voiceBtn.style.display = 'none';
        }

        // ವಾಯ್ಸ್ ಲಿಸ್ಟ್ ಲೋಡ್ ಆಗಲು ಬ್ಯಾಕಪ್ ಟ್ರಿಗರ್
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = window.speechSynthesis.getVoices;
        }
    </script>
</body>
</html>
